<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repetitionslabbet: Inför muntliga provet – Naturkunskap 1a1</title>
  <style>
    :root {
      /* Ljust läge (Standard) */
      --bg-main: #f4f6f9;
      --bg-header: #ffffff;
      --bg-card: #ffffff;
      --bg-card-alt: #f1f5f9;
      --bg-input: #ffffff;
      --bg-completed: #f8fafc;
      --accent: #d97706;
      --accent-hover: #b45309;
      --accent-text: #ffffff;
      --blue: #0369a1;
      --blue-bg: #e0f2fe;
      --green: #15803d;
      --green-bg: #dcfce7;
      --red: #b91c1c;
      --red-bg: #fee2e2;
      --purple: #7e22ce;
      --purple-bg: #f3e8ff;
      --text-main: #0f172a;
      --text-heading: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
      --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }

    body.dark-mode {
      --bg-main: #12161c;
      --bg-header: #0d1117;
      --bg-card: #1b222c;
      --bg-card-alt: #232c38;
      --bg-input: #101419;
      --bg-completed: #161d26;
      --accent: #f59e0b;
      --accent-hover: #fbbf24;
      --accent-text: #111827;
      --blue: #38bdf8;
      --blue-bg: rgba(56, 189, 248, 0.14);
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.15);
      --red: #f87171;
      --red-bg: rgba(248, 113, 113, 0.15);
      --purple: #c084fc;
      --purple-bg: rgba(192, 132, 252, 0.15);
      --text-main: #f3f4f6;
      --text-heading: #ffffff;
      --text-muted: #cbd5e1;
      --border: #334155;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-size: 18px;
      line-height: 1.65;
      letter-spacing: 0.012em;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Sticky Top Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-header);
      border-bottom: 2px solid var(--border);
      padding: 10px 18px;
      box-shadow: var(--shadow);
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.12rem;
      color: var(--accent);
    }

    .brand-badge {
      background: var(--accent);
      color: var(--accent-text);
      padding: 2px 9px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Level Segmented Switch */
    .level-switch {
      display: inline-flex;
      background-color: var(--bg-card-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .level-btn {
      padding: 6px 11px;
      font-size: 0.86rem;
      font-weight: 800;
      border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
    }

    .level-btn.active-e {
      background-color: var(--green-bg);
      color: var(--green);
      border-color: var(--green);
    }

    .level-btn.active-ca {
      background-color: var(--purple-bg);
      color: var(--purple);
      border-color: var(--purple);
    }

    .voice-select {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      max-width: 175px;
      cursor: pointer;
    }

    .progress-wrap {
      max-width: 980px;
      margin: 8px auto 0;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background-color: var(--bg-card-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #f59e0b);
      transition: width 0.35s ease;
    }

    /* Main Container */
    main {
      max-width: 980px;
      margin: 22px auto 64px;
      padding: 0 16px;
    }

    /* Teacher Walkthrough Panel (Shift+L) */
    .teacher-panel {
      background: linear-gradient(135deg, #1e1b4b, #172554);
      border: 2px solid #818cf8;
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 20px;
      color: #f8fafc;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      font-size: 1rem;
    }

    .teacher-panel-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .teacher-title {
      font-weight: 800;
      font-size: 1.1rem;
      color: #e0e7ff;
    }

    .teacher-overview-box {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(129, 140, 248, 0.45);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 10px 0 14px;
      color: #f1f5f9;
      line-height: 1.55;
    }

    .teacher-nav-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .teacher-stage-btn {
      background: rgba(30, 41, 59, 0.9);
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 6px 11px;
      font-size: 0.85rem;
      border-radius: 8px;
      font-weight: 700;
    }

    .teacher-stage-btn.active {
      background: #6366f1;
      border-color: #a5b4fc;
      color: #ffffff;
    }

    .teacher-action-btn {
      background: #312e81;
      color: #e0e7ff;
      border: 1px solid #818cf8;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }

    h1, h2, h3 {
      margin-top: 0;
      line-height: 1.3;
    }

    h1 {
      font-size: 1.75rem;
      color: var(--accent);
    }

    h2 {
      font-size: 1.42rem;
      color: var(--text-heading);
    }

    h3 {
      font-size: 1.15rem;
      color: var(--accent);
    }

    .tag {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .tag-e {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green);
    }

    .tag-ca {
      background: var(--purple-bg);
      color: var(--purple);
      border: 1px solid var(--purple);
    }

    .tag-pair {
      background: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue);
    }

    .tag-area {
      background: var(--bg-card-alt);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    /* Key Words Box */
    .vocab-box {
      background-color: var(--blue-bg);
      border-left: 5px solid var(--blue);
      border-radius: 10px;
      padding: 14px 18px;
      margin: 14px 0 20px;
    }

    .vocab-box-title {
      font-weight: 800;
      color: var(--blue);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .vocab-box ul {
      margin: 6px 0 0 0;
      padding-left: 20px;
    }

    .vocab-box li {
      margin-bottom: 5px;
    }

    /* Stacked Completed Answers */
    .history-stack {
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-header {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .completed-card {
      background-color: var(--bg-completed);
      border: 1px solid var(--border);
      border-left: 5px solid var(--green);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .completed-q {
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .completed-a {
      background-color: var(--green-bg);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .completed-exp {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .active-question-box {
      background-color: var(--bg-card);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 20px;
      margin-top: 8px;
    }

    /* Tap-to-Fill Sentence Builder */
    .sentence-builder {
      background-color: var(--bg-card-alt);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      font-size: 1.16rem;
      font-weight: 600;
      line-height: 2.1;
      margin: 14px 0;
    }

    .blank-slot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 125px;
      padding: 2px 12px;
      margin: 0 4px;
      border-radius: 8px;
      border: 2px dashed var(--accent);
      background-color: var(--bg-card);
      color: var(--accent);
      font-weight: 800;
      cursor: pointer;
      vertical-align: baseline;
    }

    .blank-slot.filled {
      border-style: solid;
      background-color: var(--blue-bg);
      border-color: var(--blue);
      color: var(--blue);
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0;
    }

    .word-chip {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 2px solid var(--border);
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .word-chip:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .word-chip.used {
      opacity: 0.4;
      cursor: default;
    }

    /* Cooldown Banner */
    .cooldown-banner {
      background-color: var(--red-bg);
      border: 1px solid var(--red);
      color: var(--red);
      font-weight: 800;
      padding: 10px 14px;
      border-radius: 10px;
      margin-top: 12px;
      text-align: center;
    }

    /* Diagnostic Grid on Summary */
    .diag-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 16px 0;
    }

    @media (min-width: 720px) {
      .diag-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .diag-card {
      background-color: var(--bg-card-alt);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .diag-card.ready {
      border-left: 5px solid var(--green);
    }

    .diag-card.review {
      border-left: 5px solid var(--accent);
    }

    /* Buttons */
    button {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 10px;
      border: none;
      padding: 12px 18px;
      transition: transform 0.08s ease, background-color 0.15s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--accent-text);
      font-size: 1.08rem;
      padding: 14px 24px;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-tts {
      background-color: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue);
      padding: 7px 13px;
      font-size: 0.92rem;
      flex-shrink: 0;
    }

    .btn-tts:hover {
      filter: brightness(0.95);
    }

    .btn-tts.speaking {
      background-color: var(--blue);
      color: #ffffff;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(3, 105, 161, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(3, 105, 161, 0); }
      100% { box-shadow: 0 0 0 0 rgba(3, 105, 161, 0); }
    }

    /* Inputs & Starter Chips */
    label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input[type="text"], textarea, select {
      width: 100%;
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .no-paste-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-card-alt);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .starter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .chip-btn {
      background-color: var(--bg-card);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 12px;
      font-size: 0.9rem;
      border-radius: 8px;
    }

    .chip-btn:hover {
      background-color: var(--accent);
      color: var(--accent-text);
    }

    /* Choice Options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    @media (min-width: 700px) {
      .options-grid.two-col {
        grid-template-columns: 1fr 1fr;
      }
    }

    .option-btn {
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 2px solid var(--border);
      text-align: left;
      justify-content: flex-start;
      padding: 15px 18px;
      font-weight: 600;
      line-height: 1.45;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .option-btn.selected {
      border-color: var(--blue);
      background-color: var(--blue-bg);
    }

    .option-btn.correct {
      border-color: var(--green);
      background-color: var(--green-bg);
      color: var(--text-main);
    }

    .option-btn.wrong {
      border-color: var(--red);
      background-color: var(--red-bg);
      color: var(--text-main);
    }

    /* Feedback Box */
    .feedback-box {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 10px;
      border-left: 5px solid var(--blue);
      background-color: var(--bg-card-alt);
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.ok {
      border-left-color: var(--green);
      background-color: var(--green-bg);
    }

    .feedback-box.err {
      border-left-color: var(--red);
      background-color: var(--red-bg);
    }

    /* Pair Discussion Box */
    .pair-box {
      background-color: var(--bg-card-alt);
      border: 2px solid var(--blue);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 18px;
    }

    .followup-box {
      background-color: var(--purple-bg);
      border: 2px solid var(--purple);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-top: 16px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 10px;
      margin: 10px 0;
      cursor: pointer;
    }

    .checkbox-row input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: var(--green);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Oral Timer */
    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-card-alt);
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    /* Toast Warning */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #991b1b;
      color: #ffffff;
      border: 2px solid #f87171;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      z-index: 9999;
      display: none;
      max-width: 90vw;
      text-align: center;
    }

    .nav-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .summary-textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.95rem;
      min-height: 360px;
      background-color: var(--bg-card-alt);
      color: var(--text-main);
      border: 2px solid var(--green);
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-badge">Slutrepetition</span>
      <span>Repetitionslabbet: Inför muntliga provet</span>
    </div>
    <div class="top-controls">
      <div class="level-switch" role="group" aria-label="Välj svårighetsnivå">
        <button type="button" class="level-btn active-e" id="btnModeE" onclick="setLevelMode('E')">
          🟢 E-nivå
        </button>
        <button type="button" class="level-btn" id="btnModeCA" onclick="setLevelMode('CA')">
          🟣 C/A-nivå
        </button>
      </div>
      <select id="voiceSelect" class="voice-select" title="Välj röst för uppläsning" onchange="selectVoice(this.value)">
        <option value="">🗣️ Laddar röster...</option>
      </select>
      <button type="button" class="btn-tts" id="btnAutoTts" onclick="toggleAutoTts()">
        🔊 Auto-ljud: AV
      </button>
      <button type="button" class="btn-secondary" style="padding: 7px 10px; font-size: 0.88rem;" onclick="stopSpeech()">
        ⏹ Stopp
      </button>
      <button type="button" class="btn-secondary" id="btnTheme" style="padding: 7px 10px; font-size: 0.88rem;" onclick="toggleTheme()">
        🌙 Mörkt läge
      </button>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-meta">
      <span id="stageLabel">Start: Par-incheckning</span>
      <span id="timeEstimate">Ca 40 min • Alla 4 provområden</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </div>
</header>

<main id="appContainer"></main>

<div id="toast"></div>

<script>
/* =========================================================
   1. NATURAL SWEDISH TEXT-TO-SPEECH (CHROMEBOOK OPTIMIZED)
   ========================================================= */
let availableSvVoices = [];
let selectedVoiceURI = '';
let autoTts = false;
let currentSpeakBtn = null;
let speechQueue = [];
let isSpeakingQueue = false;

function scoreSwedishVoice(voice) {
  const name = (voice.name || '').toLowerCase();
  const lang = (voice.lang || '').toLowerCase();
  let score = 0;

  if (lang === 'sv-se') score += 40;
  else if (lang.startsWith('sv')) score += 20;

  if (name.includes('google')) score += 100;
  if (name.includes('natural') || name.includes('neural') || name.includes('online')) score += 90;
  if (name.includes('alva') || name.includes('klara') || name.includes('oskar') || name.includes('sofie') || name.includes('mattias')) score += 70;
  if (!voice.localService) score += 30;

  if (name.includes('espeak') || name.includes('compact') || name.includes('android')) score -= 60;

  return score;
}

function loadSwedishVoices() {
  if (!('speechSynthesis' in window)) return;
  const allVoices = window.speechSynthesis.getVoices();
  if (!allVoices || allVoices.length === 0) return;

  const svVoices = allVoices
    .filter(v => (v.lang || '').toLowerCase().startsWith('sv'))
    .sort((a, b) => scoreSwedishVoice(b) - scoreSwedishVoice(a));

  availableSvVoices = svVoices;

  const selectEl = document.getElementById('voiceSelect');
  if (!selectEl) return;

  if (svVoices.length === 0) {
    selectEl.innerHTML = `<option value="">🗣️ Standardröst</option>`;
    return;
  }

  if (!selectedVoiceURI || !svVoices.some(v => v.voiceURI === selectedVoiceURI)) {
    selectedVoiceURI = svVoices[0].voiceURI;
  }

  selectEl.innerHTML = svVoices.map((v, i) => {
    const cleanName = v.name
      .replace(/Microsoft |Google |Desktop |\(Sweden\)|Swedish/gi, '')
      .trim() || `Svensk röst ${i + 1}`;
    const tag = i === 0 ? ' ⭐' : '';
    return `<option value="${escapeHtml(v.voiceURI)}" ${v.voiceURI === selectedVoiceURI ? 'selected' : ''}>🗣️ ${escapeHtml(cleanName)}${tag}</option>`;
  }).join('');
}

function selectVoice(uri) {
  selectedVoiceURI = uri;
  speakText("Hej! Så här låter den här rösten.");
}

if ('speechSynthesis' in window) {
  loadSwedishVoices();
  window.speechSynthesis.onvoiceschanged = loadSwedishVoices;
}

function stopSpeech() {
  speechQueue = [];
  isSpeakingQueue = false;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  if (currentSpeakBtn) {
    currentSpeakBtn.classList.remove('speaking');
    currentSpeakBtn = null;
  }
}

function splitIntoSentences(text) {
  const clean = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  if (!clean) return [];
  return clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g).map(s => s.trim()).filter(Boolean);
}

function speakNextInQueue() {
  if (speechQueue.length === 0) {
    isSpeakingQueue = false;
    if (currentSpeakBtn) {
      currentSpeakBtn.classList.remove('speaking');
      currentSpeakBtn = null;
    }
    return;
  }

  const sentence = speechQueue.shift();
  const utterance = new SpeechSynthesisUtterance(sentence);
  utterance.lang = 'sv-SE';

  const chosenVoice = availableSvVoices.find(v => v.voiceURI === selectedVoiceURI) || availableSvVoices[0];
  if (chosenVoice) {
    utterance.voice = chosenVoice;
  }

  utterance.rate = 0.94;
  utterance.pitch = 1.02;

  utterance.onend = () => {
    if (isSpeakingQueue) {
      setTimeout(speakNextInQueue, 120);
    }
  };
  utterance.onerror = () => {
    stopSpeech();
  };

  window.speechSynthesis.speak(utterance);
}

function speakText(text, btnEl = null) {
  if (!('speechSynthesis' in window)) {
    showToast("Din webbläsare stöder tyvärr inte uppläsning.");
    return;
  }
  stopSpeech();
  loadSwedishVoices();

  const sentences = splitIntoSentences(text);
  if (sentences.length === 0) return;

  if (btnEl) {
    currentSpeakBtn = btnEl;
    btnEl.classList.add('speaking');
  }

  speechQueue = sentences;
  isSpeakingQueue = true;
  speakNextInQueue();
}

function speakFromBtn(btnEl) {
  const text = btnEl.getAttribute('data-tts') || '';
  speakText(text, btnEl);
}

function toggleAutoTts() {
  autoTts = !autoTts;
  const btn = document.getElementById('btnAutoTts');
  btn.textContent = autoTts ? '🔊 Auto-ljud: PÅ' : '🔊 Auto-ljud: AV';
  if (autoTts) {
    speakText("Automatisk uppläsning är nu på.");
  } else {
    stopSpeech();
  }
}

function ttsButton(textToRead, label = "Lyssna") {
  return `<button type="button" class="btn-tts" data-tts="${escapeHtml(textToRead)}" onclick="speakFromBtn(this)">🔊 ${escapeHtml(label)}</button>`;
}

  cooldownSeconds = 3;

    }
    render();
  }, 1000);
}

/* =========================================================
   3. ANTI-PASTE & TOAST GUARDRAILS
   ========================================================= */
let toastTimeout = null;
function showToast(msg, isSuccess = false) {
  const el = document.getElementById('toast');
  el.style.backgroundColor = isSuccess ? '#14532d' : '#991b1b';
  el.style.borderColor = isSuccess ? '#22c55e' : '#f87171';
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    el.style.display = 'none';
  }, 3800);
}

function attachAntiPaste(el) {
  if (!el) return;
  el.addEventListener('paste', (e) => {
    e.preventDefault();
    showToast("🚫 Klistra in är avstängt! Skriv svaret med era egna ord.");
  });
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    showToast("🚫 Dra-och-släpp text är avstängt! Skriv med egna ord.");
  });

  let lastVal = el.value || '';
  el.addEventListener('input', () => {
    const diff = el.value.length - lastVal.length;
    if (diff > 18) {
      el.value = lastVal;
      showToast("🚫 För många tecken på en gång! Skriv svaret själva.");
    } else {
      lastVal = el.value;
    }
  });
}

function wireAllNoPasteInputs() {
  document.querySelectorAll('.no-paste').forEach(attachAntiPaste);
}

function insertStarter(textareaId, starterText) {
  const el = document.getElementById(textareaId);
  if (!el) return;
  el.value = starterText;
  el.focus();
  el.dispatchEvent(new Event('input'));
}

/* =========================================================
   5. TEACHER WALKTHROUGH MODE (Shift+L / Shift+F)
   ========================================================= */
document.addEventListener('keydown', (e) => {
  const active = document.activeElement;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) {
    return;
  }
  if (e.ctrlKey || e.altKey || e.metaKey) return;

  if (e.shiftKey && (e.code === 'KeyL' || e.key === 'L' || e.key === 'l')) {
    e.preventDefault();
    toggleTeacherMode();
  } else if (e.shiftKey && (e.code === 'KeyF' || e.key === 'F' || e.key === 'f')) {
    e.preventDefault();
    demoForwardStep();
  }
});

function toggleTeacherMode() {
  state.teacherMode = !state.teacherMode;
  if (state.teacherMode) {
    state.teacherOverviewExpanded = true;
    showToast("📋 Lektionsöversikt visad för genomgång!", true);
  } else {
    showToast("Lektionsöversikt stängd.");
  }
  render();
}

function jumpToStage(targetStage) {
  if (!state.student1) state.student1 = "Exempel-Elev 1";
  if (!state.student2) state.student2 = "Exempel-Elev 2";
  state.stage = targetStage;
  render();
}

function demoForwardStep() {
  if (!state.student1) state.student1 = "Exempel-Elev 1";
  if (!state.student2) state.student2 = "Exempel-Elev 2";
  const isCA = state.levelMode === 'CA';
  cooldownSeconds = 0;
  clearInterval(cooldownTimer);

  if (state.stage === 0) {
    if (!state.classGroup) state.classGroup = "BA23A";
    state.stage = 1;
    render();
    return;
  }

  if (state.stage === 1) {
    const qList = isCA ? s1DataCA : s1DataE;
    if (state.s1Index < qList.length) {
      const step = qList[state.s1Index];
      if (!isCA && step.type === 'fill') {
        state.s1FillSlots = [...step.answers];
        checkS1Fill();
      } else {
        const correctIdx = step.options.findIndex(o => o.correct);
        answerS1(correctIdx);
      }
    } else {
      state.stage = 2;
      render();
    }
    return;
  }

  if (state.stage === 2) {
    if (state.s2CaseIndex < s2FlawCases.length) {
      const c = s2FlawCases[state.s2CaseIndex];
      if (state.s2SubStep === 'flaw') {
        const opts = isCA ? c.flawOptionsCA : c.flawOptionsE;
        answerS2Flaw(opts.findIndex(o => o.correct));
      } else {
        const opts = isCA ? c.fixOptionsCA : c.fixOptionsE;
        answerS2Fix(opts.findIndex(o => o.correct));
      }
    } else {
      if (!state.s2Note1 || state.s2Note1.length < 10) {
        state.s2Note1 = "En hypotes ska vara ett testbart påstående med orsak, och man får bara ändra en faktor åt gången.";
      }
      if (!state.s2Note2 || state.s2Note2.length < 10) {
        state.s2Note2 = "Utan kontrollgrupp vet vi inte om resultatet berodde på behandlingen eller på slumpen och vädret.";
      }
      state.s2PeerChecks = [true, true];
      state.stage = 3;
      render();
    }
    return;
  }

  if (state.stage === 3) {
    const sc = buildScenarios[state.selectedBuild];
    const steps = isCA ? sc.stepsCA : sc.stepsE;
    if (!state.bStep1 || !state.bStep2 || !state.bStep3 || !state.bStep4) {
      state.bStep1 = steps[0].options.find(o => o.correct).text;
      state.bStep2 = steps[1].options.find(o => o.correct).text;
      state.bStep3 = steps[2].options.find(o => o.correct).text;
      state.bStep4 = steps[3].options.find(o => o.correct).text;
      render();
    } else {
      if (!state.bWhyText || state.bWhyText.length < 15) {
        state.bWhyText = sc.demoWhy;
      }
      state.bPeerChecks = [true, true];
      state.stage = 4;
      render();
    }
    return;
  }

  if (state.stage === 4) {
    if (!state.s4FollowupUnlocked) {
      state.s4MainChecks = [true, true];
      unlockFollowup();
    } else if (!state.s4Revealed) {
      state.s4FollowupChecked = true;
      revealOral();
    } else {
      rateOral('green');
    }
    return;
  }

  if (state.stage === 5) {
    showToast("Ni är redan på sista sidan (Prov-diagnos & Sammanfattning)!", true);
  }
}

/* =========================================================
   6. RENDERING FUNCTIONS
   ========================================================= */
function updateHeader() {
  const meta = stageMeta[state.stage] || stageMeta[0];
  document.getElementById('stageLabel').textContent = meta.name;
  document.getElementById('timeEstimate').textContent = meta.time;
  document.getElementById('progressBar').style.width = meta.pct + '%';
  updateLevelButtons();
}

function render() {
  stopSpeech();
  clearInterval(oralInterval);
  state.s4TimerRunning = false;
  updateHeader();

  const container = document.getElementById('appContainer');
  let html = renderTeacherBanner();

  if (state.stage === 0) html += renderStart();
  else if (state.stage === 1) html += renderStage1();
  else if (state.stage === 2) html += renderStage2();
  else if (state.stage === 3) html += renderStage3();
  else if (state.stage === 4) html += renderStage4();
  else if (state.stage === 5) html += renderSummary();

  container.innerHTML = html;
  wireAllNoPasteInputs();

  if (autoTts) {
    const autoTarget = document.querySelector('[data-autoread]');
    if (autoTarget) {
      setTimeout(() => speakText(autoTarget.getAttribute('data-autoread')), 250);
    }
  }
}

/* --- STAGE 1: BEGREPPS- & REGELCHECKEN (ALL 4 EXAM AREAS) --- */

      const slot1 = state.s1FillSlots[1];

      activeHtml = `
        <div class="active-question-box">
          <div class="card-header-row">
            <div>
              <span class="tag tag-e">E-nivå • ${escapeHtml(step.badge)}</span>
              <p style="font-size: 1.15rem; font-weight: 700; margin: 4px 0 0 0;" data-autoread="${escapeHtml(fullAudio)}">
                ${escapeHtml(step.prompt)}
              </p>
            </div>
            ${ttsButton(fullAudio, "Lyssna")}
          </div>

          <div class="sentence-builder">
            ${escapeHtml(step.parts[0])}
            <span class="blank-slot ${slot0 ? 'filled' : ''}" onclick="clearS1Slot(0)">
              ${slot0 ? escapeHtml(slot0) : '1. [ Välj ord ]'}
            </span>

            <span class="blank-slot ${slot1 ? 'filled' : ''}" onclick="clearS1Slot(1)">

          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top: 10px;">
            <button type="button" class="btn-primary" ${!slot0 || !slot1 || cooldownSeconds > 0 ? 'disabled' : ''} onclick="checkS1Fill()">
              Kontrollera meningen ✓
            </button>
            <button type="button" class="btn-secondary" onclick="state.s1FillSlots = [null, null]; render();">
              Rensa luckor
            </button>
          </div>
          ${cooldownSeconds > 0 ? `<div class="cooldown-banner">⏳ Tänk efter i ${cooldownSeconds} sek...</div>` : ''}
        </div>
      `;
    } else {
      const fullAudio = `${step.prompt}. ${step.options.map((o, i) => `Alternativ ${i + 1}: ${o.text}`).join('. ')}.`;
      activeHtml = `
        <div class="active-question-box">
          <div class="card-header-row">
            <div>
              <span class="tag ${isCA ? 'tag-ca' : 'tag-e'}">${escapeHtml(step.badge)}</span>
              <p style="font-size: 1.15rem; font-weight: 700; margin: 4px 0 0 0;" data-autoread="${escapeHtml(fullAudio)}">
                ${escapeHtml(step.prompt)}
              </p>
            </div>
            ${ttsButton(fullAudio, "Lyssna")}
          </div>

          <div class="options-grid">
            ${step.options.map((opt, idx) => `
              <button type="button" class="option-btn" ${disabledAttr} onclick="answerS1(${idx})">
                ${escapeHtml(opt.text)}
              </button>
            `).join('')}
          </div>
          ${cooldownSeconds > 0 ? `<div class="cooldown-banner">⏳ Läs alternativen noga! Ni kan svara igen om ${cooldownSeconds} sek...</div>` : ''}
        </div>
      `;
    }
  } else {
    activeHtml = `
      <div class="feedback-box show ok">
        <strong>🎉 Snyggt jobbat!</strong> Ni har klarat begreppschecken för alla 4 provområden. Nu går vi vidare och felsöker trasiga byggtester!
      </div>
      <div class="nav-footer">
        <button type="button" class="btn-secondary" onclick="resetStage1()">← Gör om Etapp 1</button>
        <button type="button" class="btn-primary" onclick="state.stage = 2; window.scrollTo({top:0, behavior:'smooth'}); render();">Vidare till Etapp 2: Hitta felet →</button>

          <h2>Begrepps- & Regelchecken (Område 1–4)</h2>
        </div>
        <span style="font-weight: 700; color: var(--text-muted);">${state.s1History.length} / ${qList.length} klara</span>
      </div>

      <div class="vocab-box">
        <div class="vocab-box-title">

      ${activeHtml}

function pickS1Word(word) {
  if (state.s1FillSlots[0] === null) state.s1FillSlots[0] = word;
  else if (state.s1FillSlots[1] === null) state.s1FillSlots[1] = word;
  render();
}

function clearS1Slot(idx) {
  state.s1FillSlots[idx] = null;
  render();
}

function checkS1Fill() {
  const step = s1DataE[state.s1Index];
  if (!step || step.type !== 'fill') return;
  if (state.s1FillSlots[0] !== step.answers[0] || state.s1FillSlots[1] !== step.answers[1]) {
    state.s1FillSlots = [null, null];
    state.areaMisses[step.area]++;
    triggerClickCooldown("Inte riktigt! Titta i den blå rutan och välj rätt två ord.");
    return;
  }
  state.s1Score++;
  state.areaDone[step.area]++;
  state.s1History.push({
    prompt: step.completedQ,
    chosenText: step.completedA,
    explanation: step.explanation
  });
  state.s1FillSlots = [null, null];
  state.s1Index++;
  render();
  if (autoTts) speakText("Rätt! " + step.explanation);
}

function answerS1(idx) {
  if (cooldownSeconds > 0) return;
  const qList = state.levelMode === 'CA' ? s1DataCA : s1DataE;
  const step = qList[state.s1Index];
  const chosen = step.options[idx];
  if (!chosen.correct) {
    state.areaMisses[step.area]++;
    triggerClickCooldown(chosen.trap || "Inte riktigt! Läs alternativen en gång till.");
    return;
  }
  state.s1Score++;
  state.areaDone[step.area]++;
  state.s1History.push({
    prompt: step.prompt,
    chosenText: chosen.text,
    explanation: step.explanation
  });
  state.s1Index++;
  render();
  if (autoTts) speakText("Rätt! " + step.explanation);
}

function resetStage1() {
  state.s1Index = 0;
  state.s1Score = 0;
  state.s1History = [];
  state.s1FillSlots = [null, null];
  render();
}

/* --- STAGE 2: HITTA FELET I BYGGET (DIAGNOSTIC FLAW-SPOTTING) --- */
function renderStage2() {
  const isCA = state.levelMode === 'CA';
  const disabledAttr = cooldownSeconds > 0 ? 'disabled' : '';

  let historyHtml = '';
  if (state.s2History.length > 0) {
    historyHtml = `
      <div class="history-stack">
        <div class="history-header">✅ Lagade byggfel (${state.s2History.length} / ${s2FlawCases.length}):</div>
        ${state.s2History.map((h, i) => `
          <div class="completed-card">
            <div class="completed-q">${i + 1}. ${escapeHtml(h.title)}</div>
            <div class="completed-a">🔧 Felet: ${escapeHtml(h.flawText)} → Lösning: ${escapeHtml(h.fixText)}</div>

    const fullAudio = `${c.title}. ${scenarioText}. ${currentPrompt}. ${currentOpts.map((o, i) => `Alternativ ${i + 1}: ${o.text}`).join('. ')}.`;

    activeHtml = `
      <div class="active-question-box">
        <div class="card-header-row">
          <div>
            <span class="tag ${isCA ? 'tag-ca' : 'tag-e'}">${escapeHtml(c.badge)}</span>
            <h3 style="margin: 4px 0 0 0;">${escapeHtml(c.title)}</h3>

          ${ttsButton(fullAudio, "Lyssna")}

        <div style="background: var(--bg-card-alt); border-left: 5px solid var(--accent); padding: 14px 16px; border-radius: 10px; margin: 12px 0;" data-autoread="${escapeHtml(fullAudio)}">
          ${escapeHtml(scenarioText)}
        </div>

        <p style="font-weight: 700; font-size: 1.1rem;">${escapeHtml(currentPrompt)}</p>

        <div class="options-grid">
          ${currentOpts.map((opt, idx) => `
            <button type="button" class="option-btn" ${disabledAttr} onclick="${isFlawStep ? `answerS2Flaw(${idx})` : `answerS2Fix(${idx})`}">
              ${escapeHtml(opt.text)}
            </button>
          `).join('')}
        </div>
        ${cooldownSeconds > 0 ? `<div class="cooldown-banner">⏳ Tänk efter i ${cooldownSeconds} sek innan ni väljer igen...</div>` : ''}
      </div>
    `;
  } else {
    activeHtml = `
      <div class="pair-box">
        <span class="tag tag-pair">✍️ Kort sammanfattning av byggfelen • Par-check</span>
        <h3>Skriv med egna ord & kolla med kompisen</h3>
        <div class="no-paste-badge">🚫 Klistra in är avstängt – skriv med era egna ord</div>

        <label for="txtS2Note1">1. Varför får man bara ändra <strong>en faktor åt gången</strong> i ett test?</label>
        <div class="starter-chips">
          <button type="button" class="chip-btn" onclick="insertStarter('txtS2Note1', 'Man får bara ändra en faktor åt gången för att annars ')">
            + Starta meningen åt oss
          </button>
        </div>
        <textarea id="txtS2Note1" class="no-paste" rows="2" placeholder="Man får bara ändra en faktor åt gången för att annars...">${escapeHtml(state.s2Note1)}</textarea>

        <label for="txtS2Note2" style="margin-top: 10px;">2. Varför räcker det inte med att en säljare säger att deras egen produkt funkar?</label>
        <div class="starter-chips">
          <button type="button" class="chip-btn" onclick="insertStarter('txtS2Note2', 'Det räcker inte eftersom säljaren tjänar pengar på produkten och därför behövs ')">
            + Starta meningen åt oss
          </button>
        </div>
        <textarea id="txtS2Note2" class="no-paste" rows="2" placeholder="Det räcker inte eftersom...">${escapeHtml(state.s2Note2)}</textarea>

        <div style="margin: 12px 0;">
          <strong>✅ Kompis-check (kryssa i när ni läst upp svaren högt):</strong>
          <label class="checkbox-row">
            <input type="checkbox" id="chkS2A" ${state.s2PeerChecks[0] ? 'checked' : ''} onchange="state.s2PeerChecks[0] = this.checked" />

      <div class="card-header-row">
        <div>
          <span class="tag ${isCA ? 'tag-ca' : 'tag-e'}">${isCA ? '🟣 C/A-nivå' : '🟢 E-nivå'} • Etapp 2 av 4</span>
          <h2>Hitta felet i bygget (Område 1–4)</h2>
        </div>
        <span style="font-weight: 700; color: var(--text-muted);">${state.s2History.length} / ${s2FlawCases.length} klara</span>

let tempChosenFlawText = '';

function answerS2Flaw(idx) {
  if (cooldownSeconds > 0) return;
  const isCA = state.levelMode === 'CA';
  const c = s2FlawCases[state.s2CaseIndex];
  const opts = isCA ? c.flawOptionsCA : c.flawOptionsE;
  const chosen = opts[idx];
  if (!chosen.correct) {
    state.areaMisses[c.area]++;
    triggerClickCooldown(chosen.trap || "Inte riktigt! Läs beskrivningen av bygget en gång till.");
    return;
  }
  tempChosenFlawText = chosen.text;
  state.s2SubStep = 'fix';
  render();
  if (autoTts) speakText("Rätt hittat! Nu: " + c.fixPrompt);
}

function answerS2Fix(idx) {
  if (cooldownSeconds > 0) return;
  const isCA = state.levelMode === 'CA';
  const c = s2FlawCases[state.s2CaseIndex];
  const opts = isCA ? c.fixOptionsCA : c.fixOptionsE;
  const chosen = opts[idx];
  if (!chosen.correct) {
    state.areaMisses[c.area]++;
    triggerClickCooldown(chosen.trap || "Inte riktigt! Tänk på hur vi gör testet vetenskapligt rättvist.");
    return;
  }
  state.areaDone[c.area]++;
  state.s2History.push({
    title: c.title,
    flawText: tempChosenFlawText,
    fixText: chosen.text,
    explanation: c.explanation
  });
  tempChosenFlawText = '';
  state.s2SubStep = 'flaw';
  state.s2CaseIndex++;
  render();
  if (autoTts) speakText("Snyggt lagat! " + c.explanation);
}

function finishStage2() {
  const n1 = document.getElementById('txtS2Note1').value.trim();
  const n2 = document.getElementById('txtS2Note2').value.trim();
  const c1 = document.getElementById('chkS2A').checked;
  const c2 = document.getElementById('chkS2B').checked;

  if (n1.length < 12 || n2.length < 12) {
    showToast("Skriv korta svar i båda rutorna innan ni går vidare!");
    return;
  }
  if (!c1 || !c2) {
    showToast("Kryssa i båda kompis-checkarna när ni pratat igenom svaren högt!");
    return;
  }
  state.s2Note1 = n1;
  state.s2Note2 = n2;
  state.s2PeerChecks = [c1, c2];
  state.stage = 3;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

/* --- STAGE 3: BYGG ETT EGET VATTENTÄTT TEST --- */
function renderStage3() {
  const isCA = state.levelMode === 'CA';
  const sc = buildScenarios[state.selectedBuild];
  const steps = isCA ? sc.stepsCA : sc.stepsE;
  const introText = isCA ? sc.introCA : sc.introE;
  const disabledAttr = cooldownSeconds > 0 ? 'disabled' : '';
  const selectedVals = [state.bStep1, state.bStep2, state.bStep3, state.bStep4];

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag ${isCA ? 'tag-ca' : 'tag-e'}">${isCA ? '🟣 C/A-nivå' : '🟢 E-nivå'} • Etapp 3 av 4</span>
          <h2>Bygg ett eget vattentätt test</h2>
        </div>
        ${ttsButton(introText, "Lyssna")}
      </div>

      <p><strong>Välj ett av de två byggtesten nedan:</strong></p>
      <div class="options-grid two-col" style="margin-bottom: 16px;">
        <button type="button" class="option-btn ${state.selectedBuild === 'hammer' ? 'selected' : ''}" onclick="selectBuildScenario('hammer')">
          🔨 Alternativ A: Vibrationsdämpande bilningshammare
        </button>
        <button type="button" class="option-btn ${state.selectedBuild === 'scaffold' ? 'selected' : ''}" onclick="selectBuildScenario('scaffold')">
          🪜 Alternativ B: Halkskydd på byggställning i regn
        </button>
      </div>

      <div style="background: var(--bg-card-alt); padding: 14px 16px; border-radius: 10px; border-left: 5px solid var(--blue); margin-bottom: 18px;" data-autoread="${escapeHtml(introText)}">
        <strong>Uppdrag:</strong> ${escapeHtml(introText)}
      </div>

      ${steps.map((st, sIdx) => `
        <div style="margin-bottom: 18px;">
          <p style="font-weight: 700; margin-bottom: 6px;">${escapeHtml(st.label)}</p>
          <div class="options-grid two-col">
            ${st.options.map((opt, oIdx) => {
              const isPicked = selectedVals[sIdx] === opt.text;
              return `
                <button type="button" class="option-btn ${isPicked ? 'correct' : ''}" ${disabledAttr} onclick="pickBuildCard(${sIdx}, ${oIdx})">
                  ${isPicked ? '✓ ' : ''}${escapeHtml(opt.text)}
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `).join('')}

      ${cooldownSeconds > 0 ? `<div class="cooldown-banner">⏳ Tänk efter i ${cooldownSeconds} sek innan ni väljer igen...</div>` : ''}

      <div class="pair-box">
        <div class="no-paste-badge">🚫 Klistra in är avstängt – skriv med era egna ord</div>
        <label for="txtBuildWhy"><strong>Förklara ert upplägg med egna ord:</strong> Hur vet ni att resultatet från ert test går att lita på?</label>
        <div class="starter-chips">
          <button type="button" class="chip-btn" onclick="insertStarter('txtBuildWhy', 'Vårt test går att lita på eftersom vi har en kontrollgrupp och bara ändrar ')">
            + Starta förklaringen åt oss
          </button>
        </div>
        <textarea id="txtBuildWhy" class="no-paste" rows="3" placeholder="Vårt test går att lita på eftersom...">${escapeHtml(state.bWhyText)}</textarea>

        <div style="margin: 12px 0;">
          <strong>✅ Kompis-check (kryssa i när ni berättat upplägget högt för varandra):</strong>
          <label class="checkbox-row">
            <input type="checkbox" id="chkBuildA" ${state.bPeerChecks[0] ? 'checked' : ''} onchange="state.bPeerChecks[0] = this.checked" />
            <span>Vi sa vår <strong>hypotes</strong> (som ett påstående) och vad som är <strong>kontrollgrupp</strong>.</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox" id="chkBuildB" ${state.bPeerChecks[1] ? 'checked' : ''} onchange="state.bPeerChecks[1] = this.checked" />
            <span>Vi sa hur vi håller <strong>övriga faktorer lika</strong> och minskar <strong>felkällor</strong>.</span>
          </label>
        </div>
      </div>

      <div class="nav-footer">
        <button type="button" class="btn-secondary" onclick="state.stage = 2; window.scrollTo({top:0, behavior:'smooth'}); render();">← Tillbaka</button>
        <button type="button" class="btn-primary" onclick="finishStage3()">Vidare till Etapp 4: Provsimulatorn →</button>
      </div>
    </div>
  `;
}

function selectBuildScenario(key) {
  state.selectedBuild = key;
  state.bStep1 = '';
  state.bStep2 = '';
  state.bStep3 = '';
  state.bStep4 = '';
  render();
}

function pickBuildCard(stepIdx, optIdx) {
  if (cooldownSeconds > 0) return;
  const isCA = state.levelMode === 'CA';
  const sc = buildScenarios[state.selectedBuild];
  const steps = isCA ? sc.stepsCA : sc.stepsE;
  const opt = steps[stepIdx].options[optIdx];
  const areaMap = [2, 3, 4, 4];

  if (!opt.correct) {
    state.areaMisses[areaMap[stepIdx]]++;
    triggerClickCooldown(opt.trap || "Inte riktigt! Tänk på reglerna för ett vetenskapligt test.");
    return;
  }

  state.areaDone[areaMap[stepIdx]]++;
  if (stepIdx === 0) state.bStep1 = opt.text;
  else if (stepIdx === 1) state.bStep2 = opt.text;
  else if (stepIdx === 2) state.bStep3 = opt.text;
  else if (stepIdx === 3) state.bStep4 = opt.text;
  render();
}

function finishStage3() {
  if (!state.bStep1 || !state.bStep2 || !state.bStep3 || !state.bStep4) {
    showToast("Klicka fram rätt kort på alla fyra stegen ovan först!");
    return;
  }
  const why = document.getElementById('txtBuildWhy').value.trim();
  if (why.length < 15) {
    showToast("Skriv minst en mening som förklarar ert upplägg i rutan!");
    return;
  }
  const c1 = document.getElementById('chkBuildA').checked;
  const c2 = document.getElementById('chkBuildB').checked;
  if (!c1 || !c2) {
    showToast("Kryssa i båda kompis-checkarna när ni pratat igenom upplägget högt!");
    return;
  }
  state.bWhyText = why;
  state.bPeerChecks = [c1, c2];
  state.stage = 4;
  state.s4Index = 0;
  state.s4MainChecks = [false, false];
  state.s4FollowupUnlocked = false;
  state.s4FollowupChecked = false;
  state.s4Revealed = false;
  state.s4TimerVal = 45;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

/* --- STAGE 4: MUNTLIGA PROVSIMULATORN MED LÄRARENS FÖLJDFRÅGA --- */
function renderStage4() {
  const item = s4OralCases[state.s4Index];
  const speakerName = state.s4Index % 2 === 0 ? state.student1 : state.student2;
  const listenerName = state.s4Index % 2 === 0 ? state.student2 : state.student1;
  const checkText = item.checklist.join(' ');

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag tag-pair">🎤 Muntliga Provsimulatorn • Fråga ${state.s4Index + 1} av ${s4OralCases.length}</span>
          <h2>Provsimulering med Lärarens följdfråga</h2>
        </div>
        ${ttsButton(item.mainQ, "Läs upp frågan")}
      </div>

      <p style="margin-bottom: 10px;">
        <span class="tag tag-area">${escapeHtml(item.badge)}</span><br/>
        🗣️ <strong>${escapeHtml(speakerName)}</strong> sitter i heta stolen och svarar högt. <strong>${escapeHtml(listenerName)}</strong> är examinator och kryssar i nyckelorden!
      </p>

      <div style="background: var(--bg-card-alt); border: 2px solid var(--accent); padding: 18px 20px; border-radius: 12px; margin: 12px 0;">
        <p style="font-size: 1.2rem; font-weight: 800; margin: 0;" data-autoread="${escapeHtml(item.mainQ)}">
          ${escapeHtml(item.mainQ)}
        </p>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0;">
        <div class="timer-pill">⏱️ Snacktid: <span id="oralTimerDisplay">${state.s4TimerVal}</span> sek</div>
        <button type="button" class="btn-secondary" onclick="startOralTimer()">▶️ Starta 45 sek timer</button>
        <button type="button" class="btn-secondary" onclick="state.s4ShowNotes = !state.s4ShowNotes; render();">
          ${state.s4ShowNotes ? '▲ Dölj våra anteckningar' : '📖 Titta på våra anteckningar'}
        </button>
      </div>

      ${state.s4ShowNotes ? `
        <div class="vocab-box" style="margin-bottom: 16px;">
          <div class="vocab-box-title"><span>📖 Era egna anteckningar från repetitionen:</span></div>
          <ul>
            <li><strong>En faktor åt gången:</strong> ${escapeHtml(state.s2Note1 || 'Ändra bara en faktor så vet vi vad som orsakade resultatet.')}</li>
            <li><strong>Källkritik & säljare:</strong> ${escapeHtml(state.s2Note2 || 'Kolla intressekonflikter, oberoende granskning och ursprungskällan.')}</li>
            <li><strong>Ert eget testupplägg:</strong> ${escapeHtml(state.bWhyText || 'Kontrollgrupp, testbar hypotes, rimlig slutsats och minskade felkällor.')}</li>
          </ul>
        </div>
      ` : ''}

      <div class="pair-box">
        <strong>Steg A • ${escapeHtml(listenerName)} kryssar i när ${escapeHtml(speakerName)} sagt nyckelorden högt:</strong>
        ${item.mainChecksE.map((kw, kIdx) => `
          <label class="checkbox-row">
            <input type="checkbox" ${state.s4MainChecks[kIdx] ? 'checked' : ''} onchange="state.s4MainChecks[${kIdx}] = this.checked" />
            <span>${escapeHtml(kw)}</span>
          </label>
        `).join('')}

        ${!state.s4FollowupUnlocked ? `
          <button type="button" class="btn-primary" style="margin-top: 10px;" onclick="unlockFollowup()">
            🎤 Nästa: Öppna Lärarens följdfråga →
          </button>
        ` : ''}
      </div>

      ${state.s4FollowupUnlocked ? `
        <div class="followup-box">
          <div class="card-header-row" style="margin-bottom: 8px;">
            <strong style="font-size: 1.1rem; color: var(--purple);">${escapeHtml(item.followupQ)}</strong>
            ${ttsButton(item.followupQ, "Lyssna")}
          </div>
          <p style="margin: 4px 0 10px 0; font-size: 0.95rem;">
            <strong>${escapeHtml(speakerName)}</strong> svarar på följdfrågan – <strong>${escapeHtml(listenerName)}</strong> kryssar i:
          </p>
          <label class="checkbox-row">
            <input type="checkbox" ${state.s4FollowupChecked ? 'checked' : ''} onchange="state.s4FollowupChecked = this.checked" />
            <span>${escapeHtml(item.followupCheckE)}</span>
          </label>

          ${!state.s4Revealed ? `
            <button type="button" class="btn-primary" style="margin-top: 10px;" onclick="revealOral()">
              👀 Visa facit & prov-checklista
            </button>
          ` : ''}
        </div>
      ` : ''}

      ${state.s4Revealed ? `
        <div class="feedback-box show ok">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
            <div>
              <strong>✅ Det här vill läraren höra på provet:</strong>
              <ul style="margin: 8px 0 0 0;">
                ${item.checklist.map(c => `<li>${escapeHtml(c)}</li>`).join('')}
              </ul>
            </div>
            ${ttsButton(checkText, "Lyssna på facit")}
          </div>
        </div>

        <p style="margin-top: 18px; font-weight: 700;">Hur gick ${escapeHtml(speakerName)}s svar + följdfråga?</p>
        <div class="options-grid two-col">
          <button type="button" class="option-btn" onclick="rateOral('green')">
            🟢 ${escapeHtml(speakerName)} klarade både frågan och följdfrågan!
          </button>
          <button type="button" class="option-btn" onclick="rateOral('yellow')">
            🟡 Vi behövde kika på facit (nu sitter det!)
          </button>
        </div>
      ` : ''}
    </div>
  `;
}

function startOralTimer() {
  clearInterval(oralInterval);
  state.s4TimerVal = 45;
  state.s4TimerRunning = true;
  const disp = document.getElementById('oralTimerDisplay');
  if (disp) disp.textContent = state.s4TimerVal;

  oralInterval = setInterval(() => {
    state.s4TimerVal--;
    const d = document.getElementById('oralTimerDisplay');
    if (d) d.textContent = Math.max(0, state.s4TimerVal);
    if (state.s4TimerVal <= 0) {
      clearInterval(oralInterval);
      state.s4TimerRunning = false;
      showToast("⏱️ Tiden är ute! Dags för följdfrågan eller facit.");
    }
  }, 1000);
}

function unlockFollowup() {
  if (!state.s4MainChecks[0] || !state.s4MainChecks[1]) {
    showToast("Svara högt på huvudfrågan först och kryssa i båda nyckelorden!");
    return;
  }
  state.s4FollowupUnlocked = true;
  render();
  if (autoTts) speakText(s4OralCases[state.s4Index].followupQ);
}

function revealOral() {
  if (!state.s4FollowupChecked) {
    showToast("Svara på Lärarens följdfråga och kryssa i rutan innan ni öppnar facit!");
    return;
  }
  clearInterval(oralInterval);
  state.s4Revealed = true;
  render();
}

function rateOral(rating) {
  const item = s4OralCases[state.s4Index];
  state.s4Ratings[state.s4Index] = rating;
  if (rating === 'yellow') {
    state.areaMisses[item.area]++;
  } else {
    state.areaDone[item.area]++;
  }

  if (state.s4Index < s4OralCases.length - 1) {
    state.s4Index++;
    state.s4MainChecks = [false, false];
    state.s4FollowupUnlocked = false;
    state.s4FollowupChecked = false;
    state.s4Revealed = false;
    state.s4TimerVal = 45;
    render();
  } else {
    state.stage = 5;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  }
}

/* --- STAGE 5: PROV-DIAGNOS & GOOGLE CLASSROOM SUMMARY --- */
function getAreaDiagnostics() {
  return [1, 2, 3, 4].map(areaId => {
    const misses = state.areaMisses[areaId] || 0;
    const isReady = misses <= 1;
    return {
      id: areaId,
      name: areaNames[areaId],
      misses,
      isReady,
      statusText: isReady ? "🟢 Sitter säkert inför provet" : "🟡 Repetera 5 min före provet"
    };
  });
}

function buildSummaryReport() {
  const isCA = state.levelMode === 'CA';
  const mins = Math.max(1, Math.round((Date.now() - state.startTime) / 60000));
  const nowStr = new Date().toLocaleDateString('sv-SE');
  const diags = getAreaDiagnostics();
  const buildName = buildScenarios[state.selectedBuild].name;

  const s1OralStatus = [state.s4Ratings[0], state.s4Ratings[2]].filter(r => r === 'green').length;
  const s2OralStatus = [state.s4Ratings[1], state.s4Ratings[3]].filter(r => r === 'green').length;

  let lines = [
    "==================================================",
    "PROV-DIAGNOS & SLUTREPETITION INFÖR MUNTLIGA PROVET",
    "Kurs: Naturkunskap 1a1 (Bygg- och anläggningsprogrammet)",
    "==================================================",
    `Datum: ${nowStr}`,
    `Elever: ${state.student1} & ${state.student2}`,
    state.classGroup ? `Klass/Grupp: ${state.classGroup}` : null,
    `Vald nivå i appen: ${isCA ? 'C/A-nivå' : 'E-nivå'}`,
    `Arbetstid i appen: ca ${mins} min`,
    "",
    "--- PROV-DIAGNOS PER OMRÅDE (OMRÅDE 1–4) ---",
    ...diags.map(d => `• ${d.name}: ${d.statusText}`),
    "",
    "--- MUNTLIG PROVSIMULERING (HUVUDFRÅGA + FÖLJDFRÅGA) ---",
    `• ${state.student1} (Område 1 & 3): ${s1OralStatus} / 2 sattes direkt utan facit`,
    `• ${state.student2} (Område 2 & 4): ${s2OralStatus} / 2 sattes direkt utan facit`,
    "",
    "--- PARETS EGNA FÖRKLARINGAR (ETAPP 2: HITTA FELET) ---",
    "• Varför bara ändra en faktor åt gången:",
    state.s2Note1 || "(Ej ifyllt)",
    "",
    "• Varför säljarens egna ord inte räcker (källkritik):",
    state.s2Note2 || "(Ej ifyllt)",
    "",
    "--- PARETS TESTDESIGN (ETAPP 3) ---",
    `• Valt scenario: ${buildName}`,
    `• Hypotes: ${state.bStep1 || '(Ej valt)'}`,
    `• Grupper & variabler: ${state.bStep2 || '(Ej valt)'}`,
    `• Rimlig slutsats: ${state.bStep3 || '(Ej valt)'}`,
    `• Minskad felkälla: ${state.bStep4 || '(Ej valt)'}`,
    "• Egen motivering av pålitligheten:",
    state.bWhyText || "(Ej ifyllt)",
    "",
    "==================================================",
    "Redo för det muntliga provet! Klistra in i Google Classroom."
  ].filter(item => item !== null);

  return lines.join("\n");
}

function renderSummary() {
  const report = buildSummaryReport();
  const diags = getAreaDiagnostics();
  const doneAudio = "Fantastiskt jobbat! Ni har gått igenom alla fyra provområden och är redo för det muntliga provet. Kolla er prov-diagnos nedan och kopiera sammanfattningen till Google Classroom.";

  return `
    <div class="card">
      <div class="card-header-row">
        <div>
          <span class="tag tag-e">🏆 Slutrepetition klar! • Prov-diagnos</span>
          <h1>Redo för provet, ${escapeHtml(state.student1)} & ${escapeHtml(state.student2)}!</h1>
        </div>
        ${ttsButton(doneAudio, "Lyssna")}
      </div>

      <h3>Er personliga prov-diagnos (Område 1–4):</h3>
      <div class="diag-grid">
        ${diags.map(d => `
          <div class="diag-card ${d.isReady ? 'ready' : 'review'}">
            <strong>${escapeHtml(d.name)}</strong><br/>
            <span style="font-weight: 700; color: ${d.isReady ? 'var(--green)' : 'var(--accent)'};">
              ${escapeHtml(d.statusText)}
            </span>
          </div>
        `).join('')}
      </div>

      <p data-autoread="${escapeHtml(doneAudio)}">
        Gör så här för att spara er prov-diagnos och repetitionsanteckningar:
      </p>
      <ol>
        <li>Klicka på knappen <strong>”📋 Kopiera prov-diagnos till Google Classroom”</strong> nedan.</li>
        <li>Öppna ert Google Dokument i <strong>Google Classroom</strong>.</li>
        <li>Tryck <strong>Ctrl + V</strong> för att klistra in (och använd diagnosen som fusklapp inför provet!).</li>
      </ol>

      <div style="margin: 18px 0;">
        <button type="button" class="btn-primary" style="width: 100%; font-size: 1.15rem; padding: 16px;" onclick="copySummaryToClipboard()">
          📋 Kopiera prov-diagnos till Google Classroom
        </button>
      </div>

      <label for="summaryOutput">Er färdiga prov-diagnos & sammanfattning:</label>
      <textarea id="summaryOutput" class="summary-textarea" readonly>${escapeHtml(report)}</textarea>

      <div class="nav-footer">
        <button type="button" class="btn-secondary" onclick="state.stage = 4; window.scrollTo({top:0, behavior:'smooth'}); render();">← Tillbaka till provsimulatorn</button>
      </div>
    </div>
  `;
}

function copySummaryToClipboard() {
  const textarea = document.getElementById('summaryOutput');
  const text = textarea.value;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showCopySuccess();
    }).catch(() => {
      fallbackCopy(textarea);
    });
  } else {
    fallbackCopy(textarea);
  }
}

function fallbackCopy(textarea) {
  textarea.select();
  textarea.setSelectionRange(0, 99999);
  try {
    document.execCommand('copy');
    showCopySuccess();
  } catch (err) {
    showToast("Markera texten i rutan och tryck Ctrl + C för att kopiera.");
  }
}

function showCopySuccess() {
  showToast("✅ Kopierat! Gå till Google Classroom och tryck Ctrl + V.", true);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Initial boot
render();
setTimeout(loadSwedishVoices, 300);
</script>
